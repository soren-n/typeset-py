name: Release

# Versions are managed by hand: set the version in Cargo.toml, refresh
# Cargo.lock with `cargo update --workspace`, give the Unreleased section of
# CHANGELOG.md the new version, merge, then push a tag vX.Y.Z on that commit.
# The tag must match the version in Cargo.toml and have a changelog entry, or
# nothing is published.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    if: github.repository == 'soren-n/typeset-py'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the tag against the version and changelog
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in Cargo.toml"
            exit 1
          fi
          awk -v heading="## v${VERSION} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry for v${VERSION}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  build:
    name: Build wheels
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/CI.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [check, build]
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

      # The wheels are published to PyPI rather than attached to the release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes/notes.md
