[dependencies]
pest = "2.8.7"
pest_derive = "2.8.7"
pyo3 = "0.29.0"
typeset = "4.0.0"

[lib]
# rlib in addition to cdylib so `cargo test` can link the unit tests
crate-type = ["cdylib", "rlib"]
# no doctests, and rustdoc cannot resolve the module/upstream-crate name collision
doctest = false
name = "typeset"

[package]
authors = ["Soren Norbaek <sorennorbaek@gmail.com>"]
categories = ["compilers", "template-engine"]
description = "A DSL for defining source code pretty printers"
documentation = "https://github.com/soren-n/typeset-py"
edition = "2024"
homepage = "https://github.com/soren-n/typeset-py"
keywords = ["dsl", "pretty", "printer"]
license-file = "LICENSE"
name = "typeset-py"
readme = "README.md"
repository = "https://github.com/soren-n/typeset-py"
# matches the MSRV of the typeset dependency
rust-version = "1.89"
version = "3.0.0"
