[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2.0"]

[project]
authors = [
  {name = "Soren Norbaek", email = "sorennorbaek@gmail.com"}
]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]
description = "A DSL for defining source code pretty printers"
dynamic = ["version"]
keywords = ["dsl", "pretty", "printer"]
license = {file = "LICENSE"}
maintainers = [
  {name = "Soren Norbaek", email = "sorennorbaek@gmail.com"}
]
name = "typeset-soren-n"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
documentation = "https://github.com/soren-n/typeset-py"
homepage = "https://github.com/soren-n/typeset-py"
repository = "https://github.com/soren-n/typeset-py"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
# Cargo.lock is regenerated after the version stamp and committed with the
# release so the lockfile never trails the manifest.
assets = ["Cargo.lock"]
build_command = "cargo update --workspace && maturin build --release"
commit_message = "chore(release): bump version to {version}"
major_on_zero = false
version_toml = ["Cargo.toml:package.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
default_bump_level = 0
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "docs"]

# The GitHub Release carries the generated notes; the wheels are published
# to PyPI by release.yml rather than attached to it.
[tool.semantic_release.publish]
upload_to_vcs_release = true
